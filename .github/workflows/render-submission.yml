name: Render submitted theme
run-name: theme-job:${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      revision:
        required: true
        type: string
      theme_hash:
        required: true
        type: string
      user_id:
        required: true
        type: string
      submission:
        required: true
        type: string
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify trusted revision
        env:
          EXPECTED: ${{ inputs.revision }}
          ACTUAL: ${{ github.sha }}
          TRUSTED: ${{ vars.TRUSTED_RENDERER_REVISION }}
        run: test "$EXPECTED" = "$ACTUAL" && test "$ACTUAL" = "$TRUSTED"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      # The renderer build is keyed by the trusted revision, so a hit is the same build.
      - id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            dist
            renderer/.next
          key: renderer-build-${{ runner.os }}-${{ github.sha }}
      - if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm ci && npm run build && npm run render:build
      # Saved before rendering: a failed submission still warms the next run.
      - if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            dist
            renderer/.next
          key: renderer-build-${{ runner.os }}-${{ github.sha }}
      # The runner image already has Chromium's system libraries; only the pinned browser is cached.
      - id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Generate bounded artifact
        env:
          JOB_ID: ${{ inputs.job_id }}
          RENDERER_REVISION: ${{ inputs.revision }}
          THEME_HASH: ${{ inputs.theme_hash }}
          USER_ID: ${{ inputs.user_id }}
          SUBMISSION: ${{ inputs.submission }}
        run: |
          npm run render:start > renderer.log 2>&1 &
          renderer_pid=$!
          trap 'kill "$renderer_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3010 > /dev/null; then break; fi
            sleep 1
          done
          npm run render:submission
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: theme-job-${{ inputs.job_id }}
          path: output/result.json
          if-no-files-found: error
          retention-days: 1
